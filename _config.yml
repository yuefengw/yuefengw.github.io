title: 王越峰
subtitle: Agent、RAG 与后端工程实践
description: 王越峰的个人技术博客，记录 Agent、RAG、Java 后端与工程实践。
keywords:
  - Agent
  - RAG
  - Java
  - 后端开发
  - 人工智能
author: 王越峰
language: zh-CN
timezone: Asia/Shanghai

url: https://www.wyf219.top
root: /
permalink: posts/:slug/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: "  "
  wrap: true
  hljs: false

default_category: 工程实践
category_map:
tag_map:

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

per_page: 8
pagination_dir: page

theme: butterfly

index_generator:
  path: ""
  per_page: 8
  order_by: -date

archive_generator:
  per_page: 20
  yearly: true
  monthly: true

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: " "
  order_by: -date

sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

search:
  path: search.json
  field: post
  content: true
  format: striptags

marked:
  prependRoot: true
  postAsset: false

meta_generator: true
